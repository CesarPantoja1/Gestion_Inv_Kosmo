# Blueprint de Render generado por KOSMO (NO modificar manualmente).
# Los nombres de servicio son deterministas: {slug}-api / {slug}-web
# -> URLs https://{slug}-api.onrender.com y https://{slug}-web.onrender.com
# Nota free tier: sin disco persistente; SQLite es efímero (se pierde al
# redeployar/spin-down). Para datos persistentes: Postgres o plan pago.
services:
  - type: web
    name: gestion-inv-kosmo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: BACKEND_CORS_ORIGINS
        value: https://gestion-inv-kosmo-web.onrender.com,http://localhost:5173,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
  - type: web
    name: gestion-inv-kosmo-web
    runtime: static
    rootDir: src/frontend
    buildCommand: bun install && bun run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gestion-inv-kosmo-api.onrender.com/api
